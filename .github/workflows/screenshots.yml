# Temporary: photographs the PR #5 deploy preview for review. Lives only on
# screenshots-tmp, which is deleted afterwards.
name: Screenshots (temporary)

on:
  push:
    branches: [screenshots-tmp]
    paths: [".github/workflows/screenshots.yml", ".shots/*.py"]

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    env:
      PREVIEW: https://deploy-preview-5--cosmic-mooncake-4731c8.netlify.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Screenshot the preview
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          rm -rf out && mkdir -p out
          python .shots/shoot.py "$PREVIEW/" out/review-home
          python .shots/shoot.py "$PREVIEW/portfolio/" out/review-portfolio --only desktop
          python .shots/shoot.py "$PREVIEW/portfolio/pindakaas/" out/review-pindakaas --only mobile
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f out
          git commit -m "Review screenshots from run ${{ github.run_id }}" || exit 0
          git push
